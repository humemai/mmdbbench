# The guard of the "Run it yourself" guide (docs/reproduce.md, humemai/mmdbbench#102): it runs the smallest cell of the e2 lane exactly as the
# guide says, on a clean runner, and fails when a command of the guide fails. The commands are not copied here: the workflow extracts the
# blocks that the guide marks `<!-- runnable: NAME -->` with experiments/tools/guide_blocks.py and runs them, so the guide is the one place
# the commands live. `experiments/test_reproduce_guide.py` (test-experiments.yml) checks the same blocks statically on every change.
#
# Weekly, so a change outside this repository is seen too: a new release of a library the unpinned parts of the guide use, the PyPI
# wheel, the DuckDB extension server. Also on a change to the guide, the runner, the lane scripts, the pins and this file.
#
# Cost: about 3 minutes on the free runner (4 cores, 16 GB), no Docker image, no dataset download; the e2 lane is synthetic. The larger
# cells of the guide (TPC-H SF1, SIFT1M, LDBC SF1) are not run here: their downloads and run times are in the guide, and the clean-room
# run that wrote them is on the pull request that added this file.
name: Reproduce Smoke

on:
  schedule:
    - cron: '23 4 * * 1'
  pull_request:
    paths:
      - 'docs/reproduce.md'
      - 'experiments/tools/guide_blocks.py'
      - 'experiments/e2_hybrid.py'
      - 'experiments/bench_common.py'
      - 'experiments/_arcadedb_import.py'
      - 'experiments/runner.py'
      - 'experiments/build_images.sh'
      - 'experiments/engine_pin.py'
      - '.python-version'
      - '.github/workflows/reproduce-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/reproduce.md'
      - 'experiments/tools/guide_blocks.py'
      - 'experiments/e2_hybrid.py'
      - 'experiments/bench_common.py'
      - 'experiments/_arcadedb_import.py'
      - 'experiments/runner.py'
      - 'experiments/build_images.sh'
      - 'experiments/engine_pin.py'
      - '.python-version'
      - '.github/workflows/reproduce-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2:
    name: e2 cell from the guide
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The guide asks for uv and nothing else (no Python, no Java): the runner's own Python is not used by the cell.
      - name: Setup UV package manager
        run: |
          # The uv version is pinned in the install URL, with a retry, as in test-experiments.yml.
          installer="$(mktemp)"
          curl -LsSf --retry 5 --retry-all-errors --retry-delay 5 -o "$installer" https://astral.sh/uv/0.12.0/install.sh
          sh "$installer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Extract the guide's commands
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run --no-project python experiments/tools/guide_blocks.py docs/reproduce.md --list
          uv run --no-project python experiments/tools/guide_blocks.py docs/reproduce.md \
            --name enter --name clean --name e2-arcadedb --name e2-compare --name e2-duckdb > "$RUNNER_TEMP/guide-e2.sh"
          cat "$RUNNER_TEMP/guide-e2.sh"
          bash -n "$RUNNER_TEMP/guide-e2.sh"

      # ArcadeDB embedded (JVM wheel) on the e2 cell, then the one comparator that needs nothing but a package and DuckDB's own extensions.
      - name: Run the e2 cell as the guide says
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash -eux "$RUNNER_TEMP/guide-e2.sh"

      - name: Rows the cell wrote
        if: always()
        run: ls -la experiments/*.json || true

  # The clean-room run of a larger cell of the guide, by hand (`gh workflow run reproduce-smoke.yml --ref <branch>`): the download, the cell as
  # the guide says, and the comparison, with the wall time, the peak memory of the process tree's largest process, and the size of the database.
  # Not weekly and not on pull requests: it downloads the LDBC data and runs for much longer than the e2 job.
  l2olap:
    name: l2 analytics cell from the guide (by hand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup UV package manager
        run: |
          installer="$(mktemp)"
          curl -LsSf --retry 5 --retry-all-errors --retry-delay 5 -o "$installer" https://astral.sh/uv/0.12.0/install.sh
          sh "$installer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Extract the guide's commands
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run --no-project python experiments/tools/guide_blocks.py docs/reproduce.md \
            --name enter --name sf1-data --name l2olap-arcadedb --name l2olap-compare > "$RUNNER_TEMP/guide-l2olap.sh"
          cat "$RUNNER_TEMP/guide-l2olap.sh"
          bash -n "$RUNNER_TEMP/guide-l2olap.sh"

      - name: Run the analytics cell as the guide says
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nproc; free -g; df -h /tmp
          /usr/bin/time -v bash -eux "$RUNNER_TEMP/guide-l2olap.sh"

      - name: Size of the database the cell built
        if: always()
        run: du -sh /tmp/l2_arcade || true
