# Runs the benchmark harness's own tests (experiments/test_*.py: the runner's guards, the stage generator, the exporter, the publish gates,
# and the test that every path the harness names resolves in this layout). No Docker, no timed cell and no engine runs here: the tests fake
# docker and read the fixtures that are in the repository. It needs no data and no benchmark host.
name: Test Experiments

on:
  pull_request:
    paths:
      - 'experiments/**'
      - '.github/workflows/test-experiments.yml'
  push:
    branches:
      - main
    paths:
      - 'experiments/**'
      - '.github/workflows/test-experiments.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest experiments
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup UV package manager
        run: |
          # The uv version is pinned in the install URL, with a retry.
          installer="$(mktemp)"
          curl -LsSf --retry 5 --retry-all-errors --retry-delay 5 -o "$installer" https://astral.sh/uv/0.12.0/install.sh
          sh "$installer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv --version

      # Latest releases of the five libraries the harness imports (no pins: the tests hold no number from them). The suite took about
      # 75 s in its previous repository; nothing in it needs the wheel or a JVM. `python -m pytest`, so a missing package fails instead of skipping.
      - name: Run the harness tests
        working-directory: experiments
        run: uv run --no-project --with pytest --with numpy --with pandas --with pyarrow --with requests python -m pytest -q -p no:cacheprovider .
