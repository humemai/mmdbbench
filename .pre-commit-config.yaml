# The copied harness keeps recorded data byte for byte: the fixing hooks must not rewrite fixtures, results or evidence (end-of-file-fixer
# rewrote six result files of the copy), and a checksum file or an archive is compared by its bytes.
exclude: '^experiments/(results|fixtures|evidence)/|^experiments/.*\.(sha256|gz)$|^benchmarks/python-bindings/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: detect-private-key
      - id: check-case-conflict
      - id: check-yaml
        args:
          - --allow-multiple-documents
        exclude: ^mkdocs\.yml$
      - id: check-json
