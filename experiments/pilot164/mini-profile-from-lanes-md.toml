# lanes-example: mini
host = "mini"

[profile]
name = "mini"
memory_budget_gb = 52          # proposal: 61 GB installed, 8 GB floor, rounded down
worker_cpu_budget_pct = 5   # 4 x the measured average 1.14% (up 4.0 h), never below the 24 h peak 1.57%; read from the Health page on 2026-11-18 by scripts/cpu_budget_proposal.py; the owner decides (docs/host-worker.md#the-footprint-budget)
tower_cpu_budget_pct = 33   # 4 x the measured average 2.9% (up 4.0 h), never below the 24 h peak 32.9%; read from the Health page on 2026-11-18 by scripts/cpu_budget_proposal.py; the owner decides (docs/host-worker.md#the-footprint-budget)

[lanes]
schema = 1
cpu_model = "i9-12900HK"
owner_cpus = ""                # the mini has no owner cores: the empty string says so
system_cpus = "18-19"
temp_sensor = "hwmon:coretemp:temp1_input"
thermal_gate_c = 70            # the lane kit's pre-registered value
expect_turbo = false
expect_governor = "powersave"  # the owner decides whether compare lanes want "performance" (needs root)
max_latency_us = 10            # the latency hold of a timed job (/dev/cpu_dma_latency), taken by its launcher: at most 10 microseconds (#53)
bw_beside_compare = false      # flips to true only if E2L says tolerated

[locks.bw_heavy]
max = 1
note = "streams data: loads, index builds, deep scans. Competes for the shared L3 and DRAM bandwidth"

[locks.io_heavy]
max = 1
note = "heavy disk traffic"

[locks.exclusive]
max = 1
barrier = "heavy"
note = "a job that needs the heavy work of the host to itself (MEASURE 1)"

[lanes.solo]
class = "solo"
mode = "observe"
purpose = "one paper cell alone, for an absolute number"
cpus = "0-11"
memory_gb = 48                 # proposal
excludes = ["compare*", "bulk"]
aliases = ["paper-chain"]
busy_patterns = ['q[VN][0-9]{2}\.sh', 'runner\.py']   # the paper chain's stage scripts; the lane kit's guard has the full list

[lanes.compare1]
class = "compare"
purpose = "a timed A/B study beside the other compare lanes"
cpus = "0,2"
idle = "1,3"
memory_gb = 12                 # the lane kit's cap
max_h = 14
excludes = ["solo"]

[lanes.compare2]
class = "compare"
purpose = "a timed A/B study beside the other compare lanes"
cpus = "4,6"
idle = "5,7"
memory_gb = 12
max_h = 14
excludes = ["solo"]

[lanes.compare3]
class = "compare"
purpose = "a timed A/B study beside the other compare lanes"
cpus = "8,10"
idle = "9,11"
memory_gb = 12
max_h = 14
excludes = ["solo"]

[lanes.bulk]
class = "bulk"
purpose = "untimed work: builds, tests, data preparation, loads"
cpus = "12-17"
memory_gb = 16                 # proposal: the budget less the three compare caps (rule L9)
excludes = ["solo"]
aliases = ["direct"]

# Optional: the thresholds of the paired A/B timing (docs/paired-ab.md, rule L18). Every key is a field of `controlplane.ab.AbRules`, the default is the benchmark notes' own number and a key left out keeps it.
# Written here at the defaults so that the table is visible; delete a line to follow the default. A wrong key or value is a problem of the profile (it puts no lane off), and `worker ab run` refuses a profile with a problem.
[ab]
temp_gap_c = 5                 # TEMP: the two arms started more than this many degrees apart, the pair is dropped
throttle_gap = 0.01            # THROTTLE: the arms' throttled shares of their wall time differ by more than 1 point, the pair is dropped
min_pairs = 7                  # fewer clean pairs than this: no verdict
report_min_pairs = 10          # a figure is reportable with this many clean pairs
